# Sujet de chaque cours : il sert à afficher le logo de la technologie (ou une icône générique) sur les cartes,
# les bannières et les images de partage. À copier dans content/sujets.yaml.
#
# logo  : nom de fichier du paquet npm « simple-icons » (version 16.x), affiché dans SA COULEUR D'ORIGINE, non modifié.
#         null = pas de logo de marque : on affiche l'icône générique.
# icone : nom d'icône du paquet « lucide-react » (version 1.x), dessinée dans la couleur du domaine.
#
# Règle des marques (décision d'Olivier, 10 novembre 2026) : un logo sert uniquement à dire « ce cours porte sur X ».
# Pas de logo pour les éditeurs aux règles strictes (Oracle/Java, AWS, Microsoft, Red Hat, Atlassian, CNCF/Kubernetes,
# Grafana) : icône générique à la place. Si un éditeur demande le retrait de son logo, on met logo: null ici, et c'est tout.

