services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      POSTGRES_DB: academy
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  api:
    build: ./api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://academy:${DB_PASSWORD}@db:5432/academy
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      INVITE_CODE: ${INVITE_CODE:?Définir INVITE_CODE dans .env}
      FORMATEUR_EMAIL: ${FORMATEUR_EMAIL:?Définir FORMATEUR_EMAIL dans .env}
      CONTENT_DIR: /content
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
    volumes:
      - ./content:/content:ro          # les cours : modifier un fichier .md puis redémarrer l'API
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000/api}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
