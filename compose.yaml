services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
      POSTGRES_DB: academy
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Joignable depuis cette machine seulement (développement : npm run dev), jamais depuis l'extérieur.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy"]
      interval: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  api:
    build: ./api
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://academy:${DB_PASSWORD}@db:5432/academy
      JWT_SECRET: ${JWT_SECRET:?Définir JWT_SECRET dans .env}
      # Le compte créé avec cette adresse devient admin (FORMATEUR_EMAIL reste accepté)
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      FORMATEUR_EMAIL: ${FORMATEUR_EMAIL:-}
      # Sans SMTP_HOST, les liens de vérification sont écrits dans le journal (docker compose logs api)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Saint Stack Academy <no-reply@localhost>}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      CONTENT_DIR: /content
      UPLOADS_DIR: /data/uploads
      CORS_ORIGIN: ${WEB_URL:-http://localhost:3000}
    volumes:
      - ./content:/content:ro          # les cours : modifier un fichier .md puis « Recharger les cours » dans l'administration
      - uploads:/data/uploads          # les photos de profil, conservées entre deux redémarrages
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      # Depuis la racine : le Dockerfile génère aussi les PowerPoint à partir de content/
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Adresse de l'API vue depuis le conteneur web (images de partage et balises générées côté serveur)
      API_INTERNE: http://api:4000/api
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
